<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="WORKSPACE · 造物间"><title>造物间 · AI 创作工作库</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body><div id="app"></div><div id="screen-wipe" aria-hidden="true"></div><dialog id="editor" aria-labelledby="editor-title"></dialog><dialog id="detail" aria-labelledby="detail-title"></dialog><dialog id="lightbox" aria-label="封面图片"></dialog><dialog id="discard-confirm" aria-labelledby="discard-title"><h2 id="discard-title">放弃修改？</h2><div class="dialog-footer"><button type="button" class="primary" data-discard="continue" autofocus>继续编辑</button><button type="button" class="secondary" data-discard="discard">放弃</button></div></dialog><dialog id="login" aria-labelledby="login-title"><form id="login-form" method="post" action="/api/auth/login"><div class="login-heading"><div><h2 id="login-title">SIGN IN</h2><p>登录工作空间</p></div><button type="button" class="close" data-auth-cancel aria-label="关闭登录">×</button></div><label>用户名<input name="username" autocomplete="username" required maxlength="100" spellcheck="false" autocapitalize="none"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><p id="login-error" class="form-error" role="alert" aria-live="polite"></p><button type="submit" class="primary login-submit">登录 →</button></form></dialog><div id="toast" role="status"></div><input id="import-file" type="file" accept="application/json" hidden><script src="/motion.js" defer></script><script src="/auth.js" defer></script><script src="/app.js" defer></script></body></html>
